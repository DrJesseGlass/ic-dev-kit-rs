name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format, clippy, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --check
      - name: clippy (all features, all targets, warnings are errors)
        run: cargo clippy --all-features --all-targets -- -D warnings
      - name: rustdoc (broken intra-doc links are errors)
        run: cargo doc --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: Test (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: No features
        run: cargo test --no-default-features
      - name: storage + telemetry
        run: cargo test --features storage,telemetry
      - name: All features (includes the ML modules)
        run: cargo test --all-features

  wasm:
    name: Check (wasm32 canister target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Check core + storage + telemetry on wasm
        run: cargo check --target wasm32-unknown-unknown --features storage,telemetry
      - name: Check example canister (exercises the export macros)
        run: cargo check --target wasm32-unknown-unknown
        working-directory: examples/simple_counter/src/example_canister
      - name: Check all features on wasm
        # The ML features pull in `getrandom`, which has no wasm32-unknown-unknown
        # backend by default. IC canisters must select the custom backend and
        # register an implementation (see README); CI mirrors that setup.
        run: cargo check --target wasm32-unknown-unknown --all-features
        env:
          RUSTFLAGS: --cfg getrandom_backend="custom"
