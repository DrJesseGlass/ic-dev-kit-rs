[package]
name = "ic-dev-kit-rs"
version = "0.4.0"
edition = "2021"
description = "Rust toolkit for IC development - standardizes HTTP generation, large object storage, Canister Geek integration, and common canister patterns"
authors = ["Jesse Glass <dr.jesse.glass@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/drjesseglass/ic-dev-kit-rs"
readme = "README.md"
keywords = ["internet-computer", "ic", "dfinity", "canister", "blockchain"]
categories = ["web-programming", "api-bindings"]
# ic-cdk 0.20 requires 1.88; nothing here needs newer.
rust-version = "1.88"
# The example is its own workspace and is excluded automatically; keep CI
# config out of the published tarball too.
exclude = [".github/", "examples/"]

[dependencies]
# IC dependencies (keep working versions)
candid = "0.10.36"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2.0"

# Telemetry
# crates.io canistergeek_ic_rust 0.6.0 still requires ic-cdk ^0.19, so the
# `telemetry` feature links a private ic-cdk 0.19 next to our 0.20. That is
# safe: canistergeek exposes no ic-cdk types, only calls seven ic0 wrappers,
# and both ic-cdk versions share one ic-cdk-executor. Measured cost is ~400
# bytes of wasm. The ic-cdk 0.20 migration is a two-line patch
# (github.com/DrJesseGlass/canistergeek_ic_rust, PR pending upstream); switch
# to the upstream release that requires ic-cdk 0.20 once it exists.
canistergeek_ic_rust = { version = "0.6", optional = true }
ic-cdk = "0.20.3"

# Storage - optional, behind feature flag
ic-stable-structures = { version = "0.7.2", optional = true }

# Candle - optional, behind feature flag (published crates.io releases)
candle-core = { version = "0.11", default-features = false, optional = true }
candle-nn = { version = "0.11", default-features = false, optional = true }
candle-transformers = { version = "0.11", default-features = false, optional = true }
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"], optional = true }

[features]
default = []
storage = ["ic-stable-structures"]
candle = ["candle-core", "candle-nn"]
text-generation = ["candle", "candle-transformers", "tokenizers"]
telemetry = ["canistergeek_ic_rust"]

[lib]
# Library only: the consumer's canister crate is the cdylib.
crate-type = ["rlib"]