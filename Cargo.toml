[package]
name = "ic-dev-kit-rs"
version = "0.4.1"
edition = "2021"
description = "Rust toolkit for IC development - standardizes HTTP generation, large object storage, Canister Geek integration, and common canister patterns"
authors = ["Jesse Glass <dr.jesse.glass@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/drjesseglass/ic-dev-kit-rs"
readme = "README.md"
keywords = ["internet-computer", "ic", "dfinity", "canister", "blockchain"]
categories = ["web-programming", "api-bindings"]
# candle-core 0.11 needs 1.94 on aarch64 (stabilized NEON f16 intrinsics);
# ic-cdk 0.20 alone would allow 1.88. The `msrv` CI job checks this.
rust-version = "1.94"
# Keep CI config and the example canister workspace out of the published
# tarball.
exclude = [".github/", "examples/"]

[dependencies]
# IC dependencies (keep working versions)
candid = "0.10.36"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2.0"

# Telemetry
# crates.io canistergeek_ic_rust 0.6.0 still requires ic-cdk ^0.19, so the
# `telemetry` feature links a private ic-cdk 0.19 next to our 0.20. That is
# safe: canistergeek exposes no ic-cdk types, only calls four stateless ic-cdk
# API wrappers (debug_print, time, canister_cycle_balance, stable_size), and both ic-cdk versions share one ic-cdk-executor. Measured cost is ~400
# bytes of wasm. The ic-cdk 0.20 migration is a two-line patch
# (github.com/DrJesseGlass/canistergeek_ic_rust, PR pending upstream); switch
# to the upstream release that requires ic-cdk 0.20 once it exists.
canistergeek_ic_rust = { version = "0.6", optional = true }
ic-cdk = "0.20.3"

# Storage - optional, behind feature flag
ic-stable-structures = { version = "0.7.2", optional = true }

# Candle - optional, behind feature flag (published crates.io releases)
# candle-core 0.11.1 moved zip from 8 to 9, and zip 9 enables getrandom's
# `wasm_js` feature on every wasm32 target. Stock getrandom 0.4.3 does not
# compile with that feature and `--cfg getrandom_backend="custom"` together,
# and the custom backend is what a canister uses. The [patch.crates-io] entry
# at the bottom of this file is what lets this repo build 0.11.1; a consumer
# needs the same entry, or candle held at 0.11.0 in its lock (README).
candle-core = { version = "0.11", default-features = false, optional = true }
candle-nn = { version = "0.11", default-features = false, optional = true }
candle-transformers = { version = "0.11", default-features = false, optional = true }
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"], optional = true }

[features]
default = []
storage = ["ic-stable-structures"]
candle = ["candle-core", "candle-nn"]
text-generation = ["candle", "candle-transformers", "tokenizers"]
telemetry = ["canistergeek_ic_rust"]

[lib]
# Library only: the consumer's canister crate is the cdylib.
crate-type = ["rlib"]

[package.metadata.docs.rs]
# Most modules (telemetry, storage, candle, text_generation, model_server) are
# feature-gated; document them all on docs.rs.
all-features = true

# getrandom 0.4.3 with one fix this crate needs: `Error::WEB_CRYPTO` is only
# named in `Display` when the wasm_js backend is the one compiled, so the
# `wasm_js` feature zip 9 turns on no longer breaks the custom backend. The
# fork also carries an opt-in `ic` backend, which nothing here selects.
#
# A [patch] applies only to the workspace being built: `cargo publish` strips
# it, and a consumer's build never sees this one. Remove it, and the README
# note, when a getrandom or zip release makes it unnecessary; the `wasm` CI
# job without the patch is the test.
[patch.crates-io]
getrandom = { git = "https://github.com/DrJesseGlass/getrandom", tag = "determinism-0.4.3.1" }
