[package]
name = "example_canister"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
candid = "0.10"
ic-cdk = "0.20.3"
ic-stable-structures = "0.7.2"
serde = { version = "1.0", features = ["derive"] }
# The library at the repository root (path is relative to this manifest)
ic-dev-kit-rs = { path = "../../../..", features = ["telemetry", "storage"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"