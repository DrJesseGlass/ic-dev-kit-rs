[package]
name = "example_canister"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
candid = "0.10"
ic-cdk = "0.20.2"
ic-stable-structures = "0.7.2"
serde = { version = "1.0", features = ["derive"] }
#canistergeek_ic_rust = "0.4.4"
canistergeek_ic_rust = { git = "https://github.com/DrJesseGlass/canistergeek_ic_rust", tag = "v0.6.0"}

# Your ic-dev-kit-rs with all features
ic-dev-kit-rs = { path = "../../../../../ic-dev-kit-rs", features = ["telemetry", "storage"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"